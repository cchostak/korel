name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  lint:
    name: Linters & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: clients/business-service/go.sum

      - name: Run Go vet and fmt check
        run: |
          cd clients/business-service
          test -z "$(gofmt -l .)" || (echo "Unformatted Go files found:" && gofmt -l . && exit 1)
          go vet ./...

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python Linters & Validate Code
        run: |
          python -m pip install --upgrade pip ruff
          ruff check clients/ tests/

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: "{extends: relaxed, rules: {line-length: {max: 180}}}"

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './tests'

      - name: Hadolint Cloud Inventory Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: 'clients/cloud-inventory/Dockerfile'
          failure-threshold: error

      - name: Hadolint Workplace Analytics Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: 'clients/workplace-analytics/Dockerfile'
          failure-threshold: error

      - name: Hadolint Business Service Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: 'clients/business-service/Dockerfile'
          failure-threshold: error

  test-unit:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: clients/business-service/go.sum

      - name: Run Go Unit Tests with Race Detector
        run: |
          cd clients/business-service
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python Dependencies & Run Python Unit Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r clients/cloud-inventory/requirements.txt
          pip install -r clients/workplace-analytics/requirements.txt
          python -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-report
          path: clients/business-service/coverage.out
          retention-days: 7

  docker-validate:
    name: Container Build & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Cloud Inventory Image
        uses: docker/build-push-action@v7
        with:
          context: ./clients/cloud-inventory
          file: ./clients/cloud-inventory/Dockerfile
          push: false
          tags: korel/client-cloud-inventory:ci-test

      - name: Build Workplace Analytics Image
        uses: docker/build-push-action@v7
        with:
          context: ./clients/workplace-analytics
          file: ./clients/workplace-analytics/Dockerfile
          push: false
          tags: korel/client-workplace-analytics:ci-test

      - name: Build Business Service Image
        uses: docker/build-push-action@v7
        with:
          context: ./clients/business-service
          file: ./clients/business-service/Dockerfile
          push: false
          tags: korel/client-business-service:ci-test

  test-integration:
    name: End-to-End Integration Smoke Tests
    needs: [test-unit, docker-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment file
        run: cp .env.example .env

      - name: Launch Docker Compose stack
        run: docker compose up -d --build

      - name: Run Integration Smoke Test Suite
        run: |
          chmod +x tests/smoke_test.sh
          ./tests/smoke_test.sh --timeout 60

      - name: Capture container logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown Docker Compose stack
        if: always()
        run: docker compose down -v
