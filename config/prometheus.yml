# ==============================================================================
# Prometheus Configuration
# Unified Corporate Telemetry Platform
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'corporate-telemetry'
    environment: 'production'

rule_files:
  - '/etc/prometheus/prometheus-rules.yml'

scrape_configs:
  - job_name: 'otel-collector-corporate-metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          pipeline: 'corporate-telemetry'

  - job_name: 'otel-collector-internal'
    scrape_interval: 5s
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          component: 'collector-internal'

  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']
